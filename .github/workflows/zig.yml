on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Install dependencies."
        run: sudo apt update && sudo apt install -y curl

      - name: "Setup Zig."
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.0

      - name: "Install ZLint."
        run: curl -fsSL https://raw.githubusercontent.com/DonIsaac/zlint/refs/heads/main/tasks/install.sh | bash

      - name: "Run tests."
        run: zig build test --summary all

      - name: "Run the example with various options."
        run: |
          cd example
          zig build run -- --greet
          zig build run -- -g
          zig build run -- greet
          zig build run -- --cgreet Alyx
          zig build run -- -c Alyx
          zig build run -- cgreet Alyx
          zig build run -- --version
          zig build run -- -v
          zig build run -- version
          zig build run -- --help
          zig build run -- -h
          zig build run -- help
          zig build run -- -gc Alyx
          zig build run -- --greet --cgreet Alyx
          zig build run -- greet cgreet Alyx
          zig build run -- hehe hoho
